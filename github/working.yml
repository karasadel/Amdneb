async def saved_projects_btn(update: Update, ctx: ContextTypes.DEFAULT_TYPE):
    q = update.callback_query; await q.answer()
    ctx.user_data.clear()
    buttons = []
    for i, p in enumerate(SAVED_PROJECTS):
        buttons.append([InlineKeyboardButton(p["title"], callback_data=f"proj_{i}")])
    buttons.append([InlineKeyboardButton("🔙 القائمة الرئيسية", callback_data="back")])
    await q.edit_message_text(
        "📁 *مشاريع محفوظة*\n\nاختر مشروعاً جاهزاً:",
        parse_mode="Markdown",
        reply_markup=InlineKeyboardMarkup(buttons))

async def saved_project_view_btn(update: Update, ctx: ContextTypes.DEFAULT_TYPE):
    q = update.callback_query; await q.answer()
    idx = int(q.data.split("_")[1])
    if idx >= len(SAVED_PROJECTS):
        await q.answer("مشروع غير موجود!"); return
    p = SAVED_PROJECTS[idx]
    code_preview = p["code"][:2000]
    try:
        await q.edit_message_text(
            f"📁 *{p['title']}*\n\n```{p['lang']}\n{code_preview}\n```\n\n"
            f"📋 انسخ الكود واضغط تنفيذ كود لتشغيله!",
            parse_mode="Markdown",
            reply_markup=InlineKeyboardMarkup([
                [InlineKeyboardButton("🔙 رجوع للمشاريع", callback_data="saved_projects")]
            ]))
    except:
        await q.edit_message_text(
            f"📁 {p['title']}\n\n{code_preview}",
            reply_markup=InlineKeyboardMarkup([
                [InlineKeyboardButton("🔙 رجوع للمشاريع", callback_data="saved_projects")]
            ]))

