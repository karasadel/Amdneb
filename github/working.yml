# ══════════════════════════════════════════════
async def cmd_ban(update: Update, ctx: ContextTypes.DEFAULT_TYPE):
    if update.effective_user.id != OWNER_ID: return
    if not ctx.args:
        await update.message.reply_text("استخدام: /ban [ID] [سبب اختياري]"); return
    try:
        target_id = int(ctx.args[0])
        reason = " ".join(ctx.args[1:]) or "بدون سبب"
        c.execute("INSERT OR REPLACE INTO banned_users(user_id,reason,banned_at) VALUES(?,?,?)",
                  (target_id, reason, datetime.now().strftime("%Y-%m-%d %H:%M")))
        conn.commit()
        await update.message.reply_text(f"✅ تم حظر `{target_id}` — السبب: {reason}", parse_mode="Markdown")
        try:
            await ctx.bot.send_message(target_id, "🚫 تم حظرك من استخدام هذا البوت.")
        except: pass
    except ValueError:
        await update.message.reply_text("❌ ID غير صحيح")

async def cmd_unban(update: Update, ctx: ContextTypes.DEFAULT_TYPE):
    if update.effective_user.id != OWNER_ID: return
    if not ctx.args:
        await update.message.reply_text("استخدام: /unban [ID]"); return
    try:
        target_id = int(ctx.args[0])
        c.execute("DELETE FROM banned_users WHERE user_id=?", (target_id,))
        conn.commit()
        await update.message.reply_text(f"✅ تم رفع الحظر عن `{target_id}`", parse_mode="Markdown")
    except ValueError:
        await update.message.reply_text("❌ ID غير صحيح")

async def cmd_users(update: Update, ctx: ContextTypes.DEFAULT_TYPE):
    if update.effective_user.id != OWNER_ID: return
    c.execute("SELECT user_id, full_name, username, first_seen FROM users ORDER BY first_seen DESC LIMIT 20")
    rows = c.fetchall()
    if not rows:
        await update.message.reply_text("لا يوجد مستخدمون بعد."); return
    text = f"👥 *المستخدمون ({len(rows)}):*\n\n"
    for r in rows:
        uname = f"@{r[2]}" if r[2] else "لا يوزر"
        text += f"• `{r[0]}` — {r[1]} ({uname}) — {r[3]}\n"
    await update.message.reply_text(text[:4000], parse_mode="Markdown")

async def cmd_broadcast(update: Update, ctx: ContextTypes.DEFAULT_TYPE):
    if update.effective_user.id != OWNER_ID: return
    if not ctx.args:
        await update.message.reply_text("استخدام: /broadcast [الرسالة]"); return
    msg = " ".join(ctx.args)
    users = all_users()
    sent = 0
    for uid in users:
        try:
            await ctx.bot.send_message(uid, f"📢 *إعلان من المالك:*\n\n{msg}", parse_mode="Markdown")
            sent += 1
            await asyncio.sleep(0.05)
        except: pass
    await update.message.reply_text(f"✅ تم الإرسال لـ {sent}/{len(users)} مستخدم")

