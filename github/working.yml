# ══════════════════════════════════════════════
#  معالج رفع الملفات (.py, .js, .cpp, .java)
# ══════════════════════════════════════════════
async def handle_document(update: Update, ctx: ContextTypes.DEFAULT_TYPE):
    user = update.effective_user
    if is_banned(user.id): return
    register_user(user)
    doc: Document = update.message.document
    if not doc: return
    fname = doc.file_name or "file"
    ext = fname.rsplit('.', 1)[-1].lower() if '.' in fname else ""
    lang_map = {'py': 'py', 'js': 'js', 'java': 'java', 'cpp': 'cpp', 'sh': 'bash', 'c': 'cpp'}
    lang = lang_map.get(ext)

    # ── إذا المستخدم اختار GitHub Pages → ارفع أي ملف عليه ──
    if ctx.user_data.get('mode') in ('host_github', 'host_step1'):
        msg = await update.message.reply_text(f"📥 جاري رفع `{fname}` على GitHub Pages...", parse_mode="Markdown")
        try:
            file = await doc.get_file()
            with tempfile.NamedTemporaryFile(delete=False, suffix=f'.{ext}') as tmp:
                await file.download_to_drive(tmp.name)
                with open(tmp.name, 'rb') as f:
                    raw = f.read()
                os.unlink(tmp.name)
            try:
                content = raw.decode('utf-8')
            except Exception:
                content = raw.decode('latin-1')
            result, err = await deploy_to_github_pages(content, fname, user.id)
            if result:
                pages_url, repo_url = result
                save_deployment(user.id, pages_url, fname)
                await msg.edit_text(
                    f"✅ *تم النشر على GitHub Pages!*\n\n"
                    f"🌐 رابط موقعك:\n`{pages_url}`\n\n"
                    f"📁 الريبو:\n`{repo_url}`\n\n"
                    f"⏳ _قد يستغرق ظهور الموقع 1-2 دقيقة_",
                    parse_mode="Markdown",
                    reply_markup=InlineKeyboardMarkup([
                        [InlineKeyboardButton("🌐 افتح الموقع", url=pages_url)],
                        [InlineKeyboardButton("📁 الريبو",      url=repo_url)],
                        [InlineKeyboardButton("🔙 رجوع",        callback_data="back")]
                    ]))
            else:
                await msg.edit_text(f"❌ فشل النشر: {err}", reply_markup=back_keyboard())
        except Exception as e:
            await msg.edit_text(f"❌ خطأ: {e}")
        ctx.user_data.clear()
        return

    # ── ملف HTML مباشرة (بدون اختيار مسبق) → GitHub Pages ──
    if ext == 'html':
        msg = await update.message.reply_text(f"📥 جاري تنزيل ورفع `{fname}` على GitHub Pages...", parse_mode="Markdown")
        try:
            file = await doc.get_file()
            with tempfile.NamedTemporaryFile(delete=False, suffix='.html') as tmp:
                await file.download_to_drive(tmp.name)
                with open(tmp.name, 'r', encoding='utf-8', errors='replace') as f:
                    content = f.read()
                os.unlink(tmp.name)
            result, err = await deploy_to_github_pages(content, fname, user.id)
            if result:
                pages_url, repo_url = result
                save_deployment(user.id, pages_url, fname)
                await msg.edit_text(
                    f"✅ *تم النشر على GitHub Pages!*\n\n"
                    f"🌐 رابط موقعك:\n`{pages_url}`\n\n"
                    f"📁 الريبو:\n`{repo_url}`\n\n"
                    f"⏳ _قد يستغرق ظهور الموقع 1-2 دقيقة_",
                    parse_mode="Markdown",
                    reply_markup=InlineKeyboardMarkup([
                        [InlineKeyboardButton("🌐 افتح الموقع", url=pages_url)],
                        [InlineKeyboardButton("📁 الريبو",      url=repo_url)],
                        [InlineKeyboardButton("🔙 رجوع",        callback_data="back")]
                    ]))
            else:
                await msg.edit_text(f"❌ فشل النشر: {err}", reply_markup=back_keyboard())
        except Exception as e:
            await msg.edit_text(f"❌ خطأ: {e}")
        return

    # ── ملف TXT → رفعه على paste.rs وإعطاء رابط مباشر ──
    if ext == 'txt':
        msg = await update.message.reply_text(f"📥 جاري تنزيل ورفع `{fname}`...", parse_mode="Markdown")
        try:
            file = await doc.get_file()
            with tempfile.NamedTemporaryFile(delete=False, suffix='.txt') as tmp:
                await file.download_to_drive(tmp.name)
                with open(tmp.name, 'r', encoding='utf-8', errors='replace') as f:
                    content = f.read()
                os.unlink(tmp.name)
            url = share_code(content)
            if url:
                save_deployment(user.id, url, fname)
                await msg.edit_text(
                    f"✅ *تم رفع الملف!*\n\n"
                    f"📄 اسم الملف: `{fname}`\n"
                    f"🔗 الرابط المباشر:\n`{url}`",
                    parse_mode="Markdown",
                    reply_markup=InlineKeyboardMarkup([
                        [InlineKeyboardButton("📄 افتح الملف", url=url)],
                        [InlineKeyboardButton("🔙 رجوع",       callback_data="back")]
                    ]))
            else:
                await msg.edit_text("❌ فشل الرفع. حاول مرة أخرى.", reply_markup=back_keyboard())
        except Exception as e:
            await msg.edit_text(f"❌ خطأ: {e}")
        return

    if not lang:
        await update.message.reply_text(
            "📎 أنواع الملفات المدعومة:\n"
            "🌐 `.html` — نشر على GitHub Pages\n"
            "📄 `.txt` — رابط مباشر\n"
            "💻 `.py` `.js` `.cpp` `.sh` — تنفيذ كود",
            parse_mode="Markdown"); return

    msg = await update.message.reply_text(f"📥 جاري تنزيل وتنفيذ `{fname}`...", parse_mode="Markdown")
    try:
        file = await doc.get_file()
        with tempfile.NamedTemporaryFile(delete=False, suffix=f'.{ext}') as tmp:
            await file.download_to_drive(tmp.name)
            with open(tmp.name, 'r', encoding='utf-8', errors='replace') as f:
                code = f.read()
            os.unlink(tmp.name)
        inc_exec(user.id)
        save_project(user.id, code[:3000], lang)
        output = await run_code(lang, code)
        try:
            await msg.edit_text(
                f"📤 *نتيجة تنفيذ `{fname}`:*\n```\n{output}\n```", parse_mode="Markdown")
        except:
            await msg.edit_text(f"📤 نتيجة:\n{output}")
        if user.id != OWNER_ID:
            await forward_to_owner(ctx.bot, user, f"[أرسل ملف: {fname}]\n{code[:200]}")
    except Exception as e:
        await msg.edit_text(f"❌ خطأ في معالجة الملف: {e}")

