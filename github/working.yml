def share_code(code: str) -> str:
    try:
        r = req.post('https://paste.rs', data=code.encode('utf-8'), timeout=10)
        if r.status_code == 201:
            return r.text.strip()
        return None
    except Exception:
        return None

# ══════════════════════════════════════════════
#  استضافة GitHub Pages
# ══════════════════════════════════════════════
def _github_pages_sync(code: str, filename: str, uid: int):
    """دالة متزامنة — تُستدعى في executor لتجنب حجب event loop"""
    if not GITHUB_TOKEN:
        return None, "❌ GITHUB_TOKEN غير مضبوط"
    headers = {
        "Authorization": f"token {GITHUB_TOKEN}",
        "Accept": "application/vnd.github+json"
    }
    try:
        user_resp = req.get("https://api.github.com/user", headers=headers, timeout=10)
        if user_resp.status_code != 200:
            return None, f"❌ فشل التحقق من توكن GitHub (كود: {user_resp.status_code})"
        gh_user = user_resp.json()["login"]
    except Exception as e:
        return None, f"❌ خطأ اتصال: {e}"

    repo_name = f"ksv-{uid}-{int(time.time())}"

    try:
        cr = req.post(
            "https://api.github.com/user/repos",
            headers=headers,
            json={"name": repo_name, "private": False, "auto_init": False},
            timeout=15
        )
        if cr.status_code == 403:
            return None, (
                "❌ *صلاحيات التوكن غير كافية!*\n\n"
                "اتبع الخطوات:\n"
                "١. روح: github.com → Settings → Developer settings\n"
                "   → Personal access tokens → *Tokens (classic)*\n"
                "٢. اضغط *Generate new token (classic)*\n"
                "٣. اختر هذه الصلاحيات: ✅ *repo* (كاملة)\n"
                "٤. انسخ التوكن وأعد ضبطه في Replit Secrets\n"
                "   باسم: `GITHUB_TOKEN`"
            )
        if cr.status_code not in (200, 201):
            return None, f"❌ فشل إنشاء الريبو: {cr.json().get('message','')}"
    except Exception as e:
        return None, f"❌ خطأ إنشاء ريبو: {e}"

    time.sleep(2)

    try:
        fname_clean  = "index.html" if filename.lower().endswith(".html") else filename
        content_b64  = base64.b64encode(code.encode("utf-8")).decode()
        pr = req.put(
            f"https://api.github.com/repos/{gh_user}/{repo_name}/contents/{fname_clean}",
            headers=headers,
            json={"message": "karasven AI deploy", "content": content_b64},
            timeout=15
        )
        if pr.status_code not in (200, 201):
            return None, f"❌ فشل رفع الملف: {pr.json().get('message','')}"
    except Exception as e:
        return None, f"❌ خطأ رفع: {e}"

    try:
        req.post(
            f"https://api.github.com/repos/{gh_user}/{repo_name}/pages",
            headers=headers,
            json={"source": {"branch": "main", "path": "/"}},
            timeout=15
        )
    except Exception:
        pass

    pages_url = f"https://{gh_user}.github.io/{repo_name}/"
    repo_url  = f"https://github.com/{gh_user}/{repo_name}"
    return (pages_url, repo_url), None

async def deploy_to_github_pages(code: str, filename: str, uid: int):
    """نسخة async — تشغّل الدالة المتزامنة في thread executor"""
    loop = asyncio.get_event_loop()
    return await loop.run_in_executor(None, _github_pages_sync, code, filename, uid)

# ══════════════════════════════════════════════
#  استضافة Vercel
# ══════════════════════════════════════════════
async def deploy_to_vercel(code: str, filename: str, uid: int):
    if not VERCEL_TOKEN:
        return None, "❌ VERCEL_TOKEN غير مضبوط"
    project_name = f"ksv-{uid}-{int(time.time())}"
    if filename.endswith('.html'):
        files = [{"file": "index.html", "data": base64.b64encode(code.encode()).decode()}]
    elif filename.endswith('.py'):
        files = [
            {"file": "api/index.py", "data": base64.b64encode(code.encode()).decode()},
            {"file": "vercel.json", "data": base64.b64encode(json.dumps({
                "builds": [{"src": "api/index.py", "use": "@vercel/python"}],
                "routes": [{"src": "/(.*)", "dest": "api/index.py"}]
            }).encode()).decode()}
        ]
    else:
        files = [{"file": filename, "data": base64.b64encode(code.encode()).decode()}]
    headers = {"Authorization": f"Bearer {VERCEL_TOKEN}", "Content-Type": "application/json"}
    try:
        resp = req.post("https://api.vercel.com/v13/deployments", headers=headers,
                        json={"name": project_name, "files": files,
                              "projectSettings": {"framework": None}, "target": "production"},
                        timeout=40)
        data = resp.json()
        if resp.status_code in (200, 201):
            url = f"https://{data.get('url', project_name + '.vercel.app')}"
            save_deployment(uid, url, project_name)
            return url, None
        return None, f"❌ Vercel: {data.get('error', {}).get('message', str(data))[:200]}"
    except Exception as e:
        return None, f"❌ خطأ اتصال: {e}"

