    # جدولة التحدي اليومي الساعة 9 صباحاً + الإحصائيات الساعة 8 صباحاً
    scheduler = AsyncIOScheduler()
    scheduler.add_job(send_daily_challenge, 'cron', hour=9, minute=0, args=[app.bot])
