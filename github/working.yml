async def notify_owner(bot, text: str) -> int | None:
    try:
        sent = await bot.send_message(chat_id=OWNER_ID, text=text, parse_mode="Markdown")
        return sent.message_id
    except Exception as e:
        print(f"[notify_owner] {e}")
        return None

async def forward_to_owner(bot, user, text: str):
    if user.id == OWNER_ID:
        return
    name     = user.full_name or "بدون اسم"
    username = f"@{user.username}" if user.username else "لا يوزر"
    msg_text = (f"📩 *رسالة جديدة*\n"
                f"👤 {name}  |  {username}\n"
                f"🆔 `{user.id}`\n\n"
                f"💬 {text[:800]}")
    mid = await notify_owner(bot, msg_text)
    if mid:
        save_message_map(mid, user.id)

# ══════════════════════════════════════════════
#  تنفيذ الأكواد
# ══════════════════════════════════════════════
async def run_code(lang: str, code: str) -> str:
    try:
        if lang == 'py':
            with tempfile.NamedTemporaryFile(mode='w', suffix='.py', encoding='utf-8', delete=False) as f:
                f.write(code); fname = f.name
            r = subprocess.run(['python', fname], capture_output=True, text=True,
                               timeout=15, encoding='utf-8', errors='replace')
            out = r.stdout or r.stderr or "✅ تنفيذ ناجح بدون خرج"
            os.unlink(fname)

        elif lang == 'js':
            with tempfile.NamedTemporaryFile(mode='w', suffix='.js', encoding='utf-8', delete=False) as f:
                f.write(code); fname = f.name
            r = subprocess.run(['node', fname], capture_output=True, text=True,
                               timeout=15, encoding='utf-8', errors='replace')
            out = r.stdout or r.stderr or "✅ تنفيذ ناجح بدون خرج"
            os.unlink(fname)

        elif lang == 'java':
            if not JAVA_BIN:
                out = "⚠️ Java غير مثبّت على هذا السيرفر حالياً."
            else:
                tmpdir = tempfile.mkdtemp()
                class_name = "Main"
                for line in code.split('\n'):
                    if 'public class ' in line:
                        class_name = line.split('public class ')[1].split()[0].split('{')[0].strip()
                        break
                fpath = os.path.join(tmpdir, f"{class_name}.java")
                with open(fpath, 'w', encoding='utf-8') as f: f.write(code)
                comp = subprocess.run([os.path.join(JAVA_BIN, 'javac'), fpath],
                                      capture_output=True, text=True, timeout=30, encoding='utf-8')
                if comp.returncode != 0:
                    out = f"❌ خطأ في الترجمة:\n{comp.stderr[:800]}"
                else:
                    run = subprocess.run([os.path.join(JAVA_BIN, 'java'), '-cp', tmpdir, class_name],
                                         capture_output=True, text=True, timeout=15, encoding='utf-8')
                    out = run.stdout or run.stderr or "✅ تنفيذ ناجح بدون خرج"
                shutil.rmtree(tmpdir, ignore_errors=True)

        elif lang == 'cpp':
            tmpdir = tempfile.mkdtemp()
            src = os.path.join(tmpdir, 'main.cpp')
            out_bin = os.path.join(tmpdir, 'main')
            with open(src, 'w', encoding='utf-8') as f: f.write(code)
            comp = subprocess.run([GPP_CMD, src, '-o', out_bin],
                                  capture_output=True, text=True, timeout=30, encoding='utf-8')
            if comp.returncode != 0:
                out = f"❌ خطأ في الترجمة:\n{comp.stderr[:800]}"
            else:
                run = subprocess.run([out_bin], capture_output=True, text=True,
                                     timeout=15, encoding='utf-8', errors='replace')
                out = run.stdout or run.stderr or "✅ تنفيذ ناجح بدون خرج"
            shutil.rmtree(tmpdir, ignore_errors=True)

        elif lang == 'bash':
            r = subprocess.run(['bash', '-c', code], capture_output=True, text=True,
                               timeout=15, encoding='utf-8', errors='replace')
            out = r.stdout or r.stderr or "✅ تنفيذ ناجح بدون خرج"

        else:
            out = "⚠️ لغة غير مدعومة"

        return out[:2000]

    except subprocess.TimeoutExpired:
        return "⚠️ تجاوز الوقت (15 ثانية)"
    except FileNotFoundError as e:
        return f"⚠️ أداة غير متوفرة: {e}"
    except Exception as e:
        return f"❌ خطأ: {e}"

