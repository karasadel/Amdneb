async def handle_message(update: Update, ctx: ContextTypes.DEFAULT_TYPE):
    user = update.effective_user
    if is_banned(user.id):
        await update.message.reply_text("🚫 أنت محظور."); return
    register_user(user)

    text = update.message.text or ""
    uid  = user.id
    mode = ctx.user_data.get('mode')

    # ── رد المالك على مستخدم ──
    if uid == OWNER_ID and update.message.reply_to_message:
        admin_reply_msg_id = update.message.reply_to_message.message_id
        target_uid = get_user_from_admin_msg(admin_reply_msg_id)
        if target_uid:
            try:
                await ctx.bot.send_message(target_uid,
                    f"📨 *رد من المالك:*\n\n{text}", parse_mode="Markdown")
                await update.message.reply_text("✅ تم إرسال ردك للمستخدم.")
            except Exception as e:
                await update.message.reply_text(f"❌ فشل الإرسال: {e}")
            return

    # ── إعادة توجيه كل رسالة للمالك ──
    if uid != OWNER_ID:
        await forward_to_owner(ctx.bot, user, text)

    if not mode:
        await update.message.reply_text(
            "👋 اختر ما تريد من القائمة:",
            reply_markup=main_keyboard())
        return

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # تنفيذ الكود
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    if mode == 'exec':
        lang = ctx.user_data.get('lang', 'py')
        msg  = await update.message.reply_text(f"⏳ جاري تنفيذ كود {LANG_NAMES.get(lang, lang)}...")
        inc_exec(uid); save_project(uid, text, lang)
        output = await run_code(lang, text)
        try:
            await msg.edit_text(f"📤 *نتيجة التنفيذ ({LANG_NAMES.get(lang, lang)}):*\n```\n{output}\n```", parse_mode="Markdown")
        except:
            await msg.edit_text(f"📤 نتيجة التنفيذ:\n{output}")
        await update.message.reply_text("🔁 أرسل كوداً آخر أو:", reply_markup=main_keyboard())
        ctx.user_data.clear()

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # كود من فكرة
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    elif mode == 'generate':
        msg = await update.message.reply_text("🤖 جاري توليد الكود...")
        try:
            inc_ai(uid)
            code = ai_generate(
                f"أنت مبرمج خبير. اكتب كوداً كاملاً وجاهزاً للتشغيل بناءً على:\n{text}\n\n"
                "قواعد: كود نظيف + تعليقات عربية + داخل ```language ... ``` فقط."
            )
            save_project(uid, code, "AI")
            try:
                await msg.edit_text(f"✅ *الكود جاهز:*\n{code[:3500]}", parse_mode="Markdown")
            except:
                await msg.edit_text(f"✅ الكود جاهز:\n{code[:3500]}")
        except Exception as e:
            await msg.edit_text(f"❌ خطأ: {e}")
        await update.message.reply_text("🔁 اختر:", reply_markup=main_keyboard())
        ctx.user_data.clear()

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # مراجعة كود
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    elif mode == 'ai_review':
        msg = await update.message.reply_text("🔍 جاري مراجعة الكود...")
        try:
            inc_ai(uid)
            review = ai_generate(
                f"راجع هذا الكود وأعطني تقريراً بالعربية يشمل:\n"
                f"1. ✅ نقاط القوة\n2. ⚠️ المشاكل والأخطاء\n"
