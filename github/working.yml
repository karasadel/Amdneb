async def game_guess_btn(update: Update, ctx: ContextTypes.DEFAULT_TYPE):
    q = update.callback_query; await q.answer()
    await q.edit_message_text("⏳ جاري تحضير اللغز...")
    puzzle = ai_generate(
        "أنشئ لغز برمجي Python قصير (3-5 أسطر كحد أقصى).\n"
        "الصيغة الإلزامية:\n"
        "الكود:\n```python\nاكتب الكود هنا\n```\n"
        "الإجابة: [ما يطبعه print() بالضبط]\n"
        "الشرح: [جملة واحدة تشرح لماذا]\n\n"
        "مهم: لا تضع print في الكود، فقط العمليات، وأخبر المستخدم ما قيمة آخر متغير."
    )
    lines  = puzzle.split('\n')
    ans    = next((l.replace('الإجابة:', '').strip() for l in lines if 'الإجابة:' in l), '؟')
    expl   = next((l.replace('الشرح:', '').strip()   for l in lines if 'الشرح:'   in l), '')
    display = '\n'.join(l for l in lines if 'الإجابة:' not in l and 'الشرح:' not in l)
    ctx.user_data['mode']            = 'game_guess'
    ctx.user_data['game_answer']     = ans
    ctx.user_data['game_explanation'] = expl
    try:
        await q.edit_message_text(
            f"🎮 *خمّن النتيجة!*\n\n{display[:1800]}\n\n✏️ ما هو الـ output؟ أرسل إجابتك:",
            parse_mode="Markdown")
    except:
        await q.edit_message_text(f"🎮 خمّن النتيجة!\n\n{display[:1800]}\n\nأرسل إجابتك:")

