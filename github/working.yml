async def send_daily_stats(bot):
    """يبعت إحصائيات يومية للمالك كل صباح"""
    try:
        c.execute("SELECT COUNT(*) FROM users")
        total_users = c.fetchone()[0]
        c.execute("SELECT COALESCE(SUM(exec_count),0), COALESCE(SUM(ai_count),0) FROM stats")
        row = c.fetchone()
        total_exec, total_ai = row[0], row[1]
        c.execute("SELECT COUNT(*) FROM deployments")
        total_deploys = c.fetchone()[0]
        today = date.today().isoformat()
        text = (
            f"📊 *إحصائيات karasven AI — {today}*\n\n"
            f"👥 إجمالي المستخدمين: `{total_users}`\n"
            f"⚡ إجمالي التنفيذات: `{total_exec}`\n"
            f"🤖 إجمالي طلبات AI: `{total_ai}`\n"
            f"🌐 إجمالي النشرات: `{total_deploys}`\n"
        )
        await bot.send_message(chat_id=OWNER_ID, text=text, parse_mode="Markdown")
    except Exception as e:
        print(f"[send_daily_stats] {e}")

async def send_daily_challenge(bot):
    today = date.today().isoformat()
    c.execute("SELECT challenge FROM daily_challenges WHERE date=?", (today,))
    row = c.fetchone()
    if not row:
        challenge = ai_generate(
            "أنشئ تحدي برمجي يومي متوسط الصعوبة بالعربية. "
            "اكتب: العنوان، المشكلة، مثال دخل/خرج، وتلميح صغير."
        )
        c.execute("INSERT OR IGNORE INTO daily_challenges(date,challenge) VALUES(?,?)", (today, challenge))
        conn.commit()
    else:
        challenge = row[0]
    users = all_users()
    for uid in users:
        try:
            await bot.send_message(
                uid,
                f"🌅 *تحدي اليوم — {today}*\n\n{challenge[:1500]}",
                parse_mode="Markdown"
            )
            await asyncio.sleep(0.05)
        except:
            pass

