def ai_generate(prompt: str, history: list = None) -> str:
    global _KEY_IDX
    messages = [{"role": "system", "content": _SYS_PROMPT}]
    if history:
        for role, msg in history[-6:]:
            messages.append({"role": role, "content": msg})
    messages.append({"role": "user", "content": prompt})

    for attempt in range(len(_AI_KEYS) * 2):
        key = _AI_KEYS[_KEY_IDX % len(_AI_KEYS)]
        try:
            resp = req.post(
                _AI_URL,
                headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                json={"model": _AI_MODEL, "messages": messages, "max_tokens": 2048},
                timeout=30
            )
            if resp.status_code == 200:
                return resp.json()["choices"][0]["message"]["content"].strip()
            elif resp.status_code in (429, 401, 403):
                _KEY_IDX = (_KEY_IDX + 1) % len(_AI_KEYS)
                time.sleep(1)
                continue
            else:
                return f"⚠️ خطأ من الخادم: {resp.status_code}"
        except Exception as e:
            _KEY_IDX = (_KEY_IDX + 1) % len(_AI_KEYS)
            time.sleep(1)
    return "⚠️ تعذّر الاتصال بالذكاء الاصطناعي — حاول بعد قليل."

