async def start(update: Update, ctx: ContextTypes.DEFAULT_TYPE):
    user = update.effective_user
    if is_banned(user.id):
        await update.message.reply_text("🚫 أنت محظور من استخدام هذا البوت.")
        return
    register_user(user)
    ctx.user_data.clear()
    name     = user.full_name or "بدون اسم"
    username = f"@{user.username}" if user.username else "لا يوزر"
    await notify_owner(ctx.bot,
        f"🆕 *دخول جديد!*\n👤 {name}  |  {username}\n🆔 `{user.id}`")
    await update.message.reply_text(
        "🤖 *karasven AI*\n\nأول بوت لعشّاق البرمجة في تيليجرام!\nاختر ما تريد 👇",
        reply_markup=main_keyboard(), parse_mode="Markdown")

